$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: 'Product Detail'
status: experimental
description: 'Full product detail layout: title, image, full description, created date and author.'
category: Content

props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: 'The product title.'
    image:
      type: string
      title: Image URL
      description: 'The product image source URL.'
    image_alt:
      type: string
      title: Image alt text
      description: 'Accessible alternative text for the image.'
    body:
      type: string
      title: Full description
      description: 'The full, formatted product description (rendered HTML).'
    created_date:
      type: integer
      title: Created date
      description: 'Unix timestamp of when the product was created; formatted for display in the template.'
    author_name:
      type: string
      title: Author name
      description: 'Display name of the product author.'
